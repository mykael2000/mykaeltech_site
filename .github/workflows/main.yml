name: Deploy Laravel Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Clean Composer state
        run: |
          rm -rf vendor
          composer clear-cache

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Remove deploy-only files
        run: |
          rm -rf .git
          rm -rf .github
          rm -rf tests
          rm -rf node_modules

      - name: Preflight checks
        id: preflight
        env:
          SSH_HOST_NEW: ${{ secrets.SSH_SERVER }}
          SSH_HOST_OLD: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -e
          host="${SSH_HOST_NEW:-$SSH_HOST_OLD}"
          if [ -z "$host" ]; then
            echo "::error::Neither 'SSH_SERVER' nor 'SSH_HOST' secret is set. The workflow accepts either name."
            exit 1
          fi
          echo "Host secret resolved: $([ -n "$SSH_HOST_NEW" ] && echo 'SSH_SERVER' || echo 'SSH_HOST (legacy name)')"
          for v in SSH_USERNAME SSH_PRIVATE_KEY SSH_PORT; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret '${v}' is NOT set. Add it in Repo Settings → Secrets and variables → Actions."
              exit 1
            fi
          done
          case "$SSH_PRIVATE_KEY" in
            *"PRIVATE KEY"*) : ;;
            *) echo "::error::SSH_PRIVATE_KEY does not look like a private key. It must contain the full -----BEGIN ... PRIVATE KEY----- / -----END ... ----- block."; exit 1 ;;
          esac
          echo "Testing TCP connectivity to $host:$SSH_PORT ..."
          if ! timeout 15 bash -c "exec 3<>/dev/tcp/$host/$SSH_PORT" 2>/dev/null; then
            echo "::error::Cannot TCP-connect to $host:$SSH_PORT from GitHub runners. Verify the port value and that the server firewall allows SSH from any IP (GitHub runner IPs are dynamic)."
            exit 1
          fi
          echo "Testing SSH authentication ..."
          echo "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          if ! ssh -i "$RUNNER_TEMP/deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes "$SSH_USERNAME@$host" "echo SSH_AUTH_OK"; then
            echo "::error::SSH authentication failed. Check that the public half of this key is in ~/.ssh/authorized_keys on the server, the username is correct, and that the key has no passphrase (or add the passphrase as the 'passphrase' input)."
            rm -f "$RUNNER_TEMP/deploy_key"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/deploy_key"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "Preflight OK — secrets set, host reachable, key authenticates."

      - name: Upload backend files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ steps.preflight.outputs.host }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./*"
          target: "~/mykaeltech"
          overwrite: true

      - name: Run remote Laravel deployment commands
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ steps.preflight.outputs.host }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd ~/mykaeltech
            mkdir -p storage/framework/cache/data
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs
            mkdir -p bootstrap/cache
            chmod -R 775 storage bootstrap/cache
            php artisan optimize:clear || true
            echo '--- migrations before (diagnostic only) ---'
            php artisan migrate:status --no-ansi || true
            echo '--- running all pending migrations ---'
            php artisan migrate --force --no-interaction
            echo '--- migrations after ---'
            php artisan migrate:status --no-ansi
            php artisan db:seed --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
